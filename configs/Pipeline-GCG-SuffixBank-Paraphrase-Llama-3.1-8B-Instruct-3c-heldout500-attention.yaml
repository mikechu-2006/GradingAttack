name: Pipeline-GCG-SuffixBank-Paraphrase-Llama-3.1-8B-Instruct-3c-heldout500-attention

method: gcg_suffix_bank
pipeline_mode: true
debug: false
log_attention: true
nclass: 3
template: ci

params:
  bank_path: result/GCG/gcg_suffix_bank_3c_promotion.jsonl
  bank_limit: null
  exclude_bank_source_indices: true

model:
  name: Llama-3.1-8B-Instruct
  model_id: "LLM-Research/Meta-Llama-3.1-8B-Instruct"

data:
  - name: scientsbank
    path: ./dataset/scientsbank.jsonl
    max_samples: 500
    random_seed: 42

generation:
  temperature: 0.01
  max_tokens: 1024

defenses:
  - type: paraphrase
    params: {}

log:
  log_dir: ./logs
  result_dir: ./result