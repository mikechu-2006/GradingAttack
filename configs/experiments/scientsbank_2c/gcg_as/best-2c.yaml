method: gcg_suffix_bank
pipeline_mode: true
debug: false
log_attention: true
nclass: 2
template: ci
model:
  name: Llama-3.1-8B-Instruct
  model_id: LLM-Research/Meta-Llama-3.1-8B-Instruct
data:
- name: scientsbank
  path: ./dataset/scientsbank.jsonl
  max_samples: 100
  random_seed: 42
generation:
  temperature: 0.01
  max_tokens: 1024
log:
  log_dir: ./logs
  result_dir: ./result
defenses:
- type: attention_sharpening
  params:
    temperature: 0.5
    layers:
    - 28
    - 29
    - 30
    - 31
params:
  bank_path: result_from_hpc_gcg_suffix_bank/gcg_suffix_bank_2c_his.jsonl
  bank_limit: null
  exclude_bank_source_indices: true
name: scientsbank-2c-gcg-as-full
