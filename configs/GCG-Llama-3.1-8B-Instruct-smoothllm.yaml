name: GCG-Llama-3.1-8B-Instruct-smoothllm

method: GCG
pipeline_mode: true

params:
  device: cuda:0
  target: '{"verdict": "correct"}'
  gcg_config:
    num_steps: 100
    search_width: 64
    topk: 64
    use_prefix_cache: true

model:
  name: Llama-3.1-8B-Instruct
  path: meta-llama/Llama-3.1-8B-Instruct
  model_id: "LLM-Research/Meta-Llama-3.1-8B-Instruct"

data:
  - name: scientsbank
    path: ./dataset/scientsbank.jsonl

generation:
  temperature: 0.01
  max_tokens: 1024

log:
  log_dir: ./logs_defense
  result_dir: ./result_defense

defenses:
  - type: smooth_llm
    params:
      num_copies: 5
      perturb_rate: 0.1
